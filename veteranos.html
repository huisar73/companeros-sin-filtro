<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga de Veteranos</title>
    <style>
        body { 
            margin:0; 
            font-family: Arial, sans-serif; 
            background:#0f0f0f; 
            color:white; 
            text-align:center; 
        }
        .hero {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('vete1.jpg') center/cover no-repeat;
            height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .galeria {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .galeria img {
            width: 300px;
            border: 3px solid #ffcc00;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .galeria img:hover {
            transform: scale(1.05);
        }

        /* Modal foto grande */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal img {
            max-width: 90%;
            max-height: 90%;
            border: 5px solid #ffcc00;
            border-radius: 15px;
        }
        .cerrar {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 50px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>⚽ Liga de Veteranos</h1>
    </div>

    <h2 style="margin:40px 0 20px;">Fotos de los Partidos</h2>

    <div class="galeria">
        <img src="vete1.jpg" alt="Foto 1" onclick="mostrarFoto(this)">
        <img src="foto2.jfif" alt="Foto 2" onclick="mostrarFoto(this)">
        <img src="equipo1.jfif" alt="Foto 3" onclick="mostrarFoto(this)">
        <img src="selfie.png" alt="Selfie" onclick="mostrarFoto(this)">
        <img src="leija.png" alt="Leija" onclick="mostrarFoto(this)">
        <img src="colombia.jpeg" alt="Colombia" onclick="mostrarFoto(this)">
    </div>

    <!-- Modal foto grande -->
    <div id="modal" class="modal" onclick="cerrarModal()">
        <span class="cerrar">×</span>
        <img id="fotoGrande" src="">
    </div>

    <a href="index.html" style="color:#ffcc00; font-size:1.5rem; margin:50px; display:inline-block;">← Volver a Inicio</a>

    <script>
        function mostrarFoto(img) {
            document.getElementById('fotoGrande').src = img.src;
            document.getElementById('modal').style.display = "flex";
        }
        function cerrarModal() {
            document.getElementById('modal').style.display = "none";
        }
    </script>

</body>
</html>
