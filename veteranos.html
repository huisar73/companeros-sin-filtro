<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veteranos 50+</title>
    <style>
        body { margin:0; font-family: Arial, sans-serif; background:#0f0f0f; color:white; text-align:center; }
        .hero {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('vete1.jpg') center/cover no-repeat;
            min-height: 65vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1 {
            font-size: 4.5rem;
            text-shadow: 0 0 40px #ffcc00;
            animation: glow 3s infinite alternate;
        }
        @keyframes glow { from {text-shadow: 0 0 20px #ffcc00;} to {text-shadow: 0 0 70px #ffcc00;} }

        .nav-botones {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 30px 20px;
            background: #1a1a1a;
        }
        .nav-boton {
            flex: 1 1 220px;
            max-width: 280px;
            padding: 18px 25px;
            background: #ffcc00;
            color: black;
            font-size: 1.3rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            border: 3px solid #fff;
            transition: all 0.3s;
        }
        .nav-boton:hover {
            transform: scale(1.08);
            background: #fff;
        }

        .seccion { padding: 80px 20px; max-width: 1200px; margin: 0 auto; }

        /* GALERÍA MÁS BONITA */
        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .galeria-item {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            transition: all 0.4s;
        }
        .galeria-item:hover {
            transform: scale(1.05);
            box-shadow: 0 20px 40px rgba(255,204,0,0.3);
        }
        .galeria-item img {
            width: 100%;
            display: block;
            transition: 0.4s;
        }
        .galeria-item:hover img {
            transform: scale(1.1);
        }
        .galeria-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            color: white;
            padding: 20px 15px 15px;
            font-size: 1.1rem;
            text-align: center;
        }

        .modal {
            display: none; position: fixed; top:0; left:0;
            width:100%; height:100%; background:rgba(0,0,0,0.95);
            z-index: 1000; align-items:center; justify-content:center;
        }
        .modal img { max-width:92%; max-height:92%; border:6px solid #ffcc00; border-radius:20px; }
        .cerrar { position:absolute; top:25px; right:35px; font-size:60px; color:white; cursor:pointer; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Veteranos 50+</h1>
    </div>

    <div class="nav-botones">
        <a href="#schedule" class="nav-boton">Próximos Partidos</a>
        <a href="#resultados" class="nav-boton">Resultados</a>
        <a href="#tabla" class="nav-boton">Tabla General</a>
        <a href="#galeria" class="nav-boton">Galería</a>
    </div>

    <!-- GALERÍA MEJORADA -->
    <section id="galeria" class="seccion" style="background:#111;">
        <h2>Galería de la Liga</h2>
        <div class="galeria">
            <div class="galeria-item">
                <img src="vete1.jpg" onclick="mostrarFoto(this)">
                <div class="galeria-caption">Partido en la cancha</div>
            </div>
            <div class="galeria-item">
                <img src="foto2.jfif" onclick="mostrarFoto(this)">
                <div class="galeria-caption">Acción del juego</div>
            </div>
            <div class="galeria-item">
                <img src="equipo1.jfif" onclick="mostrarFoto(this)">
                <div class="galeria-caption">Los equipos juntos</div>
            </div>
            <div class="galeria-item">
                <img src="selfie.png" onclick="mostrarFoto(this)">
                <div class="galeria-caption">Selfie de los veteranos</div>
            </div>
            <div class="galeria-item">
                <img src="leija.png" onclick="mostrarFoto(this)">
                <div class="galeria-caption">Leija en acción</div>
            </div>
            <div class="galeria-item">
                <img src="colombia.jpeg" onclick="mostrarFoto(this)">
                <div class="galeria-caption">Los colombianos</div>
            </div>
        </div>
    </section>

    <a href="index.html" style="color:#ffcc00; font-size:1.5rem; margin:60px 0; display:inline-block;">← Volver a Inicio</a>

    <!-- Modal -->
    <div id="modal" class="modal" onclick="if(event.target.id==='modal')cerrarModal()">
        <span class="cerrar" onclick="cerrarModal()">×</span>
        <img id="fotoGrande" src="">
    </div>

    <script>
        function mostrarFoto(img) {
            document.getElementById('fotoGrande').src = img.src;
            document.getElementById('modal').style.display = "flex";
        }
        function cerrarModal() {
            document.getElementById('modal').style.display = "none";
        }
    </script>

</body>
</html>
