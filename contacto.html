<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos - Compañeros sin filtro</title>
    <style>
        body { 
            margin:0; 
            font-family: Arial, sans-serif; 
            background:#0f0f0f; 
            color:white; 
            text-align:center; 
            padding: 40px 20px;
        }
        .contact-box {
            background: #1a1a1a;
            padding: 60px 40px;
            border-radius: 25px;
            max-width: 700px;
            margin: 40px auto;
            box-shadow: 0 0 40px rgba(0,204,102,0.3);
        }
        input, textarea {
            width: 100%;
            padding: 18px;
            margin: 12px 0;
            background: #222;
            border: 2px solid #00cc66;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
        }
        .boton {
            padding: 18px 70px;
            background: #00cc66;
            color: black;
            border: none;
            border-radius: 50px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Contáctanos</h1>
    <p style="font-size:1.8rem; margin:30px 0;">¿Quieres mandarnos un mensaje?</p>

    <div class="contact-box">
        <form action="mailto:companerossinfiltro@gmail.com" method="post" enctype="text/plain">
            <input type="text" name="Nombre" placeholder="Tu nombre" required>
            <textarea name="Mensaje" rows="8" placeholder="Escribe tu mensaje aquí..." required></textarea>
            <button type="submit" class="boton">Enviar Mensaje</button>
        </form>
    </div>

    <a href="index.html" style="color:#ffcc00; font-size:1.5rem; margin-top:50px; display:inline-block;">← Volver a Inicio</a>

</body>
</html>
