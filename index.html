<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Hover</title>
    <style>
        .boton {
            display: inline-block;
            padding: 25px 60px;
            margin: 30px;
            font-size: 1.8rem;
            background: #ffcc00;
            color: black;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.4s;
        }
        .boton:hover {
            transform: scale(1.4);
            background: red;
            color: white;
            box-shadow: 0 0 40px yellow;
        }
    </style>
</head>
<body style="background:#0f0f0f; text-align:center; padding-top:150px;">

    <a href="#" class="boton">PASA EL MOUSE AQUÍ</a>

</body>
</html>
