<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- PWA para iPhone -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffcc00">
    <link rel="apple-touch-icon" href="robe1.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Compañeros sin filtro">
    <link rel="apple-touch-startup-image" href="robe1.png">
    
    <title>Compañeros sin filtro - La Voz de la Calle</title>
    
    <style>
        /* === TU CSS ORIGINAL (igual que lo tenías) === */
        body { margin:0; font-family: Arial, sans-serif; background:#0f0f0f; color:white; text-align:center; }
        html { scroll-behavior: smooth; }

        .hero {
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), url('robe.jfif') center/cover no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        h1 { 
            font-size: clamp(3rem, 9vw, 5.8rem); 
            margin: 10px 0 8px; 
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #ffcc00, #fff, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px #ffcc00;
            animation: logoAnim 3s ease-in-out infinite alternate;
        }
        @keyframes logoAnim {
            from { text-shadow: 0 0 20px #ffcc00; }
            to   { text-shadow: 0 0 70px #ffcc00; }
        }
        p { font-size: 2rem; margin-bottom: 45px; text-shadow: 3px 3px 15px black; }

        .botones {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 100%;
        }
        .boton {
            flex: 1 1 280px;
            max-width: 280px;
            padding: 18px 30px;
            color: white;
            font-size: 1.25rem;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            border: 3px solid rgba(255,255,255,0.9);
            transition: all 0.3s;
        }
        .boton:hover { transform: scale(1.1); box-shadow: 0 0 25px rgba(255,204,0,0.8); }

        .boton.liga { background: #ffcc00; color: black; }
        .boton.episodios { background: #00aaff; }
        .boton.companeros { background: #ff8800; }
        .boton.tiktok { background: #000; }
        .boton.youtube { background: #ff0000; }
        .boton.contacto { background: #00cc66; }

        .seccion {
            padding: 110px 20px;
            max-width: 950px;
            margin: 0 auto;
        }

        /* === NUEVO: Mejoras específicas para celular === */
        @media (max-width: 480px) {
            .hero { padding: 15px; min-height: 90vh; }
            h1 { font-size: 2.5rem; letter-spacing: 2px; }
            p { font-size: 1.4rem; margin-bottom: 30px; }
            
            .boton {
                flex: 1 1 100%;  /* Botones ocupan todo el ancho en móvil */
                max-width: 100%;
                padding: 15px 20px;
                font-size: 1.1rem;
            }
            
            .seccion { padding: 60px 15px; }
            .seccion h2 { font-size: 1.8rem; }
            .seccion p { font-size: 1.2rem; }
        }
    </style>
</head>
