    <title>Compañeros sin filtro - La Voz de la Calle</title>
    
    <style>
        /* ===== VARIABLES CSS ===== */
        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-card: #1e1e2e;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --accent: #ffcc00;
            --accent-glow: rgba(255, 204, 0, 0.6);
            --blue: #00aaff;
            --orange: #ff8800;
            --green: #00cc66;
            --red: #ff0000;
            --radius: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===== BASE ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ===== HERO ===== */
        .hero {
            background: linear-gradient(135deg, rgba(15,15,15,0.9), rgba(30,30,46,0.95)), 
                        url('robe.jfif') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 900;
            letter-spacing: 3px;
            margin: 0.5rem 0;
            background: linear-gradient(90deg, var(--accent), #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px var(--accent-glow);
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px var(--accent-glow); }
            to { text-shadow: 0 0 60px var(--accent-glow), 0 0 100px var(--accent); }
        }

        .hero p {
            font-size: clamp(1.3rem, 4vw, 2rem);
            margin: 1rem 0 2.5rem;
            color: var(--text-secondary);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* ===== BOTONES ===== */
        .botones {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            max-width: 100%;
        }

        .boton {
            flex: 1 1 250px;
            max-width: 280px;
            padding: 1rem 1.8rem;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            border: 2px solid rgba(255,255,255,0.8);
            background: linear-gradient(135deg, #333, #222);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .boton:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 30px var(--accent-glow);
            border-color: var(--accent);
        }

        .boton.liga { background: linear-gradient(135deg, var(--accent), #e6b800); color: #000; }
        .boton.episodios { background: linear-gradient(135deg, var(--blue), #0088cc); }
        .boton.companeros { background: linear-gradient(135deg, var(--orange), #cc6600); }
        .boton.tiktok { background: linear-gradient(135deg, #000, #333); }
        .boton.youtube { background: linear-gradient(135deg, var(--red), #cc0000); }
        .boton.contacto { background: linear-gradient(135deg, var(--green), #00994d); }

        /* ===== SECCIONES ===== */
        .seccion {
            padding: 5rem 1.5rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .seccion h2 {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            margin-bottom: 2rem;
            text-align: center;
            position: relative;
            display: inline-block;
            left: 50%;
            transform: translateX(-50%);
        }

        .seccion h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: var(--accent);
            border-radius: 2px;
        }

        /* ===== TARJETA COMPAÑERO ===== */
        .companero-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 2rem;
            margin: 2rem auto;
            max-width: 700px;
            text-align: center;
            border: 1px solid rgba(255,204,0,0.2);
        }

        .companero-img {
            width: 100%;
            max-width: 350px;
            border: 4px solid var(--accent);
            border-radius: 15px;
            margin: 1rem auto;
            display: block;
            transition: var(--transition);
        }
        .companero-img:hover { transform: scale(1.02); box-shadow: 0 10px 40px var(--accent-glow); }

        .bio {
            font-size: 1.1rem;
            color: var(--text-secondary);
            line-height: 1.8;
            max-width: 650px;
            margin: 1.5rem auto;
        }
