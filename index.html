<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compañeros sin filtro - La Voz de la Calle</title>
    <style>
        :root {
            --yellow: #ffcc00;
        }
        body { 
            margin:0; 
            font-family: 'Arial', sans-serif; 
            background:#0a0a0a; 
            color:#eee; 
        }
        .hero {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('robe.jfif') center/cover no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        h1 { 
            font-size: clamp(2.8rem, 8vw, 5.5rem); 
            margin: 10px 0 5px; 
            text-shadow: 0 0 30px var(--yellow);
        }
        p { font-size: clamp(1.6rem, 4.5vw, 2.3rem); margin-bottom: 40px; }

        .botones {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            max-width: 100%;
            padding: 0 10px;
        }
        .boton {
            flex: 1 1 260px;
            padding: 18px 25px;
            color: white;
            font-size: 1.2rem;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            border: 3px solid rgba(255,255,255,0.9);
            transition: all 0.3s;
        }
        .boton:hover {
            transform: scale(1.08);
            box-shadow: 0 0 25px var(--yellow);
        }

        .boton.liga { background: var(--yellow); color: black; }
        .boton.episodios { background: #00aaff; }
        .boton.companeros { background: #ff6600; }
        .boton.tiktok { background: #000; }
        .boton.youtube { background: #ff0000; }
        .boton.contacto { background: #00cc66; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Compañeros sin filtro</h1>
        <p>La Voz de la Calle</p>
        
        <div class="botones">
            <a href="veteranos.html" class="boton liga">Liga Veteranos</a>
            <a href="#episodios" class="boton episodios">Episodios</a>
            <a href="#companeros" class="boton companeros">Compañeros</a>
            <a href="https://www.tiktok.com/@companerossinfiltro" target="_blank" class="boton tiktok">TikTok</a>
            <a href="https://www.youtube.com/@Companerossinfiltro" target="_blank" class="boton youtube">YouTube</a>
            <a href="contacto.html" class="boton contacto">Contáctanos</a>
        </div>
    </div>

</body>
</html>
