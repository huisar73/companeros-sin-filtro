<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compañeros sin filtro - La Voz de la Calle</title>
    <style>
        body { 
            margin:0; 
            font-family: Arial, sans-serif; 
            background:#0f0f0f; 
            color:white; 
            text-align:center; 
        }
        html { scroll-behavior: smooth; }

        .hero {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('robe.jfif') center/cover no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        h1 { font-size: 4rem; margin: 10px 0 8px; text-shadow: 4px 4px 20px black; }
        p { font-size: 2rem; margin-bottom: 40px; text-shadow: 3px 3px 15px black; }

        .botones {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            max-width: 100%;
        }
        .boton {
            flex: 1 1 280px;
            max-width: 280px;
            padding: 18px 30px;
            color: white;
            font-size: 1.25rem;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            border: 3px solid rgba(255,255,255,0.9);
            transition: all 0.3s;
        }
        .boton:hover { transform: scale(1.1); box-shadow: 0 0 25px rgba(255,204,0,0.8); }

        .boton.liga { background: #ffcc00; color: black; }
        .boton.episodios { background: #00aaff; }
        .boton.companeros { background: #ff8800; }
        .boton.tiktok { background: #000; }
        .boton.youtube { background: #ff0000; }
        .boton.contacto { background: #00cc66; }

        .seccion {
            padding: 120px 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .contact-box {
            background: #1a1a1a;
            padding: 60px 40px;
            border-radius: 25px;
            box-shadow: 0 0 40px rgba(0,204,102,0.3);
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Compañeros sin filtro</h1>
        <p>La Voz de la Calle</p>
        
        <div class="botones">
            <a href="veteranos.html" class="boton liga">Liga Veteranos</a>
            <a href="#episodios" class="boton episodios">Episodios</a>
            <a href="#companeros" class="boton companeros">Compañeros</a>
            <a href="https://www.tiktok.com/@companerossinfiltro" target="_blank" class="boton tiktok">TikTok</a>
            <a href="https://www.youtube.com/@Companerossinfiltro" target="_blank" class="boton youtube">YouTube</a>
            <a href="#contacto" class="boton contacto">Contáctanos</a>
        </div>
    </div>

    <!-- CONTÁCTANOS - Versión Limpia y Elegante -->
    <section id="contacto" class="seccion" style="background:#111;">
        <div class="contact-box">
            <h2 style="font-size:2.8rem; margin-bottom:25px;">Contáctanos</h2>
            <p style="font-size:1.6rem; margin-bottom:40px;">
                Escríbenos, te contestamos rápido.
            </p>
            
            <form action="mailto:companerossinfiltro@gmail.com" method="post" enctype="text/plain">
                <input type="text" name="Nombre" placeholder="Tu nombre" required>
                <textarea name="Mensaje" rows="6" placeholder="Escribe tu mensaje aquí..." required></textarea>
                <button type="submit" class="boton contacto" style="padding:18px 70px; font-size:1.4rem;">
                    Enviar Mensaje
                </button>
            </form>
        </div>
    </section>

</body>
</html>
